databases:
  - name: tracknest-postgres
    plan: free
    databaseName: tracknest
    user: tracknest
services:
  - type: web
    name: tracknest-web
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: '0'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: '.onrender.com'
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: 'https://*.onrender.com'
      - key: DATABASE_URL
        fromDatabase:
          name: tracknest-postgres
          property: connectionString
