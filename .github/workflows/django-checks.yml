name: Django checks
on:
  workflow_dispatch:
  push:
    branches: [main, premium-ui-redesign-2026-11-22]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check schema consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Collect static assets for Django templates
        run: python manage.py collectstatic --noinput
      - name: Run Django security and system checks
        run: python manage.py check
      - name: Test accounts and transactions
        run: python manage.py test accounts --verbosity 2
